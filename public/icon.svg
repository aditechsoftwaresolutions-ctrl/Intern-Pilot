<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#022c22" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Ring -->
  <circle cx="64" cy="64" r="46" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="64" cy="64" r="38" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.5" />

  <!-- Compass Cardinal Ticks -->
  <line x1="64" y1="20" x2="64" y2="25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="64" y1="103" x2="64" y2="108" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="20" y1="64" x2="25" y2="64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="103" y1="64" x2="108" y2="64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Modern Compass Needle / Pilot Arrow -->
  <!-- North Needle (White) -->
  <polygon points="64,28 73,64 64,57" fill="url(#needleGrad)" />
  <polygon points="64,28 55,64 64,57" fill="#A7F3D0" />

  <!-- South Needle (Dark Accent) -->
  <polygon points="64,100 73,64 64,71" fill="#064E3B" />
  <polygon points="64,100 55,64 64,71" fill="#022C22" />

  <!-- Center Pivot Core -->
  <circle cx="64" cy="64" r="6" fill="#FFFFFF" />
  <circle cx="64" cy="64" r="3" fill="#047857" />

  <!-- Mini Uganda Flag Indicator at Top Right -->
  <circle cx="98" cy="30" r="12" fill="#0B1210" stroke="#10B981" stroke-width="1.5" />
  <!-- Three mini stripes: Black, Yellow, Red -->
  <path d="M 88 26 Q 98 26 108 26" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 88 30 Q 98 30 108 30" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 88 34 Q 98 34 108 34" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />
</svg>
